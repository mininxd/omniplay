name: Build Omniplay APKs

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release APKs
        run: |
          mkdir -p release-apks
          MODERN_APK=$(find app/build/outputs/apk/modern/release/ -name "*.apk" | head -n 1)
          if [ -f "$MODERN_APK" ]; then
            cp "$MODERN_APK" release-apks/app_release.apk
          else
            echo "Error: Modern release APK not found!"
            find app/build/outputs/ -name "*.apk"
            exit 1
          fi

          LEGACY_APK=$(find app/build/outputs/apk/legacy/release/ -name "*.apk" | head -n 1)
          if [ -f "$LEGACY_APK" ]; then
            cp "$LEGACY_APK" release-apks/app_release_legacy.apk
          else
            echo "Error: Legacy release APK not found!"
            find app/build/outputs/ -name "*.apk"
            exit 1
          fi

          echo "Prepared APKs:"
          ls -lh release-apks/

      - name: Upload app_release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app_release
          path: release-apks/app_release.apk
          if-no-files-found: error

      - name: Upload app_release_legacy.apk
        uses: actions/upload-artifact@v4
        with:
          name: app_release_legacy
          path: release-apks/app_release_legacy.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
