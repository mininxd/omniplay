[package]
name = "omnieq_dsp"
version = "0.1.0"
edition = "2021"
authors = ["OmniPlay Developers"]
description = "High-performance Rust Audio DSP Core for OmniPlay & OmniQualizer"

[lib]
name = "omnieq_dsp"
crate-type = ["cdylib", "rlib"]

[dependencies]
dasp = { path = "../dasp/dasp", features = ["std", "ring_buffer", "peak", "envelope", "signal", "slice"] }
jni = "0.21"
