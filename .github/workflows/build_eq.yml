name: Build Equalizer APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust DSP Engine
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ -n "$ANDROID_NDK_ROOT" ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          elif [ -z "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            export ANDROID_NDK_HOME=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          mkdir -p equalizer/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -o equalizer/src/main/jniLibs build --release --manifest-path rust/omnieq_dsp/Cargo.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Equalizer Release APK
        run: ./gradlew :equalizer:assembleRelease --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release-apks
          EQ_APK=$(find equalizer/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$EQ_APK" ]; then
            cp "$EQ_APK" release-apks/equalizer.apk
          else
            echo "Error: Equalizer release APK not found!"
            find equalizer/build/outputs/ -name "*.apk"
            exit 1
          fi

          echo "Prepared Equalizer APK:"
          ls -lh release-apks/

      - name: Upload equalizer.apk
        uses: actions/upload-artifact@v4
        with:
          name: equalizer
          path: release-apks/equalizer.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/equalizer.apk
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
