name: Build Omniplay APKs

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APKs (armv7, armv8, x86, x86_64, universal)
        run: ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          echo "Generated APKs:"
          ls -lh app/build/outputs/apk/release/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-x86-release
          path: app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error

      - name: Create and Upload legacy-all APK (All arch: armv7 + armv8)
        run: |
          cp app/build/outputs/apk/release/app-universal-release.apk app/build/outputs/apk/release/app-legacy-all-release.apk

      - name: Upload legacy-all APK
        uses: actions/upload-artifact@v4
        with:
          name: app-legacy-all-release
          path: app/build/outputs/apk/release/app-legacy-all-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
